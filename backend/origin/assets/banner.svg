<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" rx="16" />

  <!-- Network Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
  </g>

  <!-- Topology Connection lines -->
  <g stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.7">
    <line x1="400" y1="140" x2="220" y2="260" />
    <line x1="400" y1="140" x2="340" y2="280" />
    <line x1="400" y1="140" x2="460" y2="280" />
    <line x1="400" y1="140" x2="580" y2="260" />
  </g>

  <!-- Origin Server Node -->
  <g transform="translate(400, 140)" filter="url(#glow)">
    <circle r="36" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <text text-anchor="middle" dy="-4" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">ORIGIN</text>
    <text text-anchor="middle" dy="12" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10">:8000</text>
  </g>

  <!-- Edge Nodes -->
  <g transform="translate(220, 260)" filter="url(#glow)">
    <circle r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text text-anchor="middle" dy="4" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">BOM</text>
  </g>
  <g transform="translate(340, 280)" filter="url(#glow)">
    <circle r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text text-anchor="middle" dy="4" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">SIN</text>
  </g>
  <g transform="translate(460, 280)" filter="url(#glow)">
    <circle r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text text-anchor="middle" dy="4" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">FRA</text>
  </g>
  <g transform="translate(580, 260)" filter="url(#glow)">
    <circle r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text text-anchor="middle" dy="4" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">NYC</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="1">
    MINI CDN SIMULATOR
  </text>
  <text x="400" y="85" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">
    High Performance Edge Caching &amp; Intelligent Routing Architecture
  </text>
</svg>
