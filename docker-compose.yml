version: '3.8'

services:
  # 1. Authoritative Origin Storage Server (Port 8000)
  origin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npm", "run", "start:origin"]
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
    volumes:
      - ./backend/origin/storage:/app/origin/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # 2. Mumbai Edge Server (Port 8001 - Simulated Latency: 35ms)
  edge-mumbai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "edge/edgeServer.js", "--edge=mumbai"]
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - EDGE_ID=mumbai
      - ORIGIN_URL=http://origin:8000
      - SIMULATED_EDGE_LATENCY_MS=35
    depends_on:
      origin:
        condition: service_healthy

  # 3. Singapore Edge Server (Port 8002 - Simulated Latency: 80ms)
  edge-singapore:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "edge/edgeServer.js", "--edge=singapore"]
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - EDGE_ID=singapore
      - ORIGIN_URL=http://origin:8000
      - SIMULATED_EDGE_LATENCY_MS=80
    depends_on:
      origin:
        condition: service_healthy

  # 4. Frankfurt Edge Server (Port 8003 - Simulated Latency: 150ms)
  edge-frankfurt:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "edge/edgeServer.js", "--edge=frankfurt"]
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - EDGE_ID=frankfurt
      - ORIGIN_URL=http://origin:8000
      - SIMULATED_EDGE_LATENCY_MS=150
    depends_on:
      origin:
        condition: service_healthy

  # 5. New York Edge Server (Port 8004 - Simulated Latency: 180ms)
  edge-newyork:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "edge/edgeServer.js", "--edge=newyork"]
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - EDGE_ID=newyork
      - ORIGIN_URL=http://origin:8000
      - SIMULATED_EDGE_LATENCY_MS=180
    depends_on:
      origin:
        condition: service_healthy

  # 6. Central CDN Router & Telemetry Engine (Port 9000)
  router:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npm", "run", "start:router"]
    ports:
      - "9000:9000"
    environment:
      - ROUTER_PORT=9000
      - EDGE_MUMBAI_URL=http://edge-mumbai:8001
      - EDGE_SINGAPORE_URL=http://edge-singapore:8002
      - EDGE_FRANKFURT_URL=http://edge-frankfurt:8003
      - EDGE_NEWYORK_URL=http://edge-newyork:8004
    depends_on:
      - edge-mumbai
      - edge-singapore
      - edge-frankfurt
      - edge-newyork

  # 7. React Telemetry Dashboard (Port 5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_PORT=5173
      - VITE_ROUTER_URL=http://localhost:9000
      - VITE_ORIGIN_URL=http://localhost:8000
    depends_on:
      - router
